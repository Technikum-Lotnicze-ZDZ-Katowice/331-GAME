<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
      }
      #container {
        position: absolute;
        width: 600px;
        height: 400px;
        border: 1px solid gray;
        overflow: hidden;
      }
      #rex {
        position: absolute;
        background: red;
        width: 100px;
        height: 100px;
        bottom: 100px;
        left: 50px;
      }
      #tree {
        position: absolute;
        background: brown;
        width: 50px;
        height: 100px;
        bottom: 100px;
        animation: slide 3s infinite linear;
      }
      #land {
        position: absolute;
        background: black;
        width: 100%;
        height: 100px;
        bottom: 0;
      }
      .jump {
        animation: jump 2s ease-in-out;
      }
      @keyframes slide {
        from {
          left: 100%;
        }
        to {
          left: -100px;
        }
      }
      @keyframes jump {
        0% {
          bottom: 100px;
        }
        50% {
          bottom: 250px;
        }
        100% {
          bottom: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="land"></div>
      <div id="rex"></div>
      <div id="tree"></div>
    </div>
    <script>
      const rex = document.getElementById("rex");
      const tree = document.getElementById("tree");
      let jumpInterval = null;
      document.addEventListener("keydown", function (event) {
        if (event.code === "Space") {
          rex.classList.add("jump");
          jumpInterval = setTimeout(function () {
            rex.classList.remove("jump");
          }, 2000);
        }
      });

      window.requestAnimationFrame(gameLoop);

      function gameLoop() {
        console.log("checking");

        let rexRect = rex.getBoundingClientRect();
        let treeRect = tree.getBoundingClientRect();

        if (
          rexRect.right > treeRect.left &&
          rexRect.left < treeRect.right &&
          rexRect.bottom > treeRect.top
        ) {
          console.log("touch");
          alert("gameOver");
        }

        window.requestAnimationFrame(gameLoop);
      }
    </script>
  </body>
</html>
