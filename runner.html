<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
      }
      #container {
        border: 1px solid gray;
        width: 600px;
        height: 400px;
        position: absolute;
        overflow: hidden;
      }
      #land {
        width: 100%;
        height: 100px;
        background: brown;
        position: absolute;
        bottom: 0;
      }
      #player {
        width: 100px;
        height: 100px;
        background: green;
        position: absolute;
        bottom: 100px;
        left: 50px;
      }
      .jump {
        animation: jump 1s ease-in-out;
      }

      #obstacle {
        width: 50px;
        height: 100px;
        background: red;
        position: absolute;
        bottom: 100px;
        left: 300px;
        animation: run 1.5s linear infinite;
      }
      @keyframes run {
        from {
          left: 100%;
        }
        to {
          left: -50px;
        }
      }
      @keyframes jump {
        0% {
          bottom: 100px;
        }
        50% {
          bottom: 300px;
        }
        100% {
          bottom: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="land"></div>
      <div id="obstacle"></div>
      <div id="player"></div>
    </div>
    <script>
      const player = document.getElementById("player");
      const obstacle = document.getElementById("obstacle");
      window.addEventListener("keydown", jump);

      function jump(e) {
        if (e.code === "Space") {
          console.log(e.code);
          player.classList.add("jump");
          setTimeout(function () {
            player.classList.remove("jump");
          }, 1000);
        }
      }

      gameLoop();

      function gameLoop() {
        const playerPos = player.getBoundingClientRect();
        const obstaclePos = obstacle.getBoundingClientRect();
        // console.log("running", obstaclePos.left, playerPos.bottom);

        if (
          obstaclePos.left < playerPos.left + 100 &&
          obstaclePos.top < playerPos.bottom
        ) {
          // alert("Game OVER");
          player.style.background = "yellow";
          console.log("colide");
        } else {
          player.style.background = "green";
        }

        window.requestAnimationFrame(gameLoop);
      }
    </script>
  </body>
</html>
